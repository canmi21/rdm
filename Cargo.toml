# Cargo walks up the filesystem and would otherwise treat this crate as a member of the
# workspace this directory sits in. An empty table stops that walk.
[workspace]

[package]
name = "rdm"
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/canmi21/rdm"
description = "A download manager for macOS."

[[bin]]
name = "rdm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
env_logger = "0.11"
fancy-regex = "0.19"
futures = "0.3"
gpui = { package = "gpui-unofficial", version = "1" }
# Without font-kit the macOS backend renders no text at all. See spec/framework.md.
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1", features = ["font-kit"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

# Formatting is rustfmt's and the linter must not report it; see rustfmt.toml.
[lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "warn"

# Development: our own code unoptimised so it rebuilds in seconds and steps in a debugger; the
# dependencies at full optimisation, since they change rarely and gpui unoptimised is too slow to
# look at. The codegen-unit counts are the defaults, stated: at opt-level 0 the count changes
# nothing that can be measured, and the lever for our own hot code is a crate of its own with its
# own opt-level, not fewer units here. See spec/packaging.md.
[profile.dev]
opt-level = 0
codegen-units = 256
incremental = true

[profile.dev.package."*"]
opt-level = 3
# Release's default rather than dev's 256: a dependency is compiled once and run for weeks, so it
# takes the better code. 1 would be better still and roughly doubles that one compile; not taken
# until a hot path shows it is worth it.
codegen-units = 16

# Release: the smallest binary the compiler will make. A download manager sits in the background,
# so what it costs at rest and on disk matters more than how fast it was built. `panic = "abort"`
# is a safety property as much as a size one: a panic unwinding through a GPUI callback is not a
# state worth continuing from.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The headless tests draw into gpui's test platform; see spec/workflow.md.
[dev-dependencies]
gpui = { version = "1", package = "gpui-unofficial", features = ["test-support"] }
