# Cargo walks up the filesystem and would otherwise treat this crate as a member of the
# workspace this directory sits in; declaring one here stops that walk. One package for now; the
# engine lives in src/engine as a module that nothing outside reaches into, so it can become a
# crate of its own the day something else needs it.
[workspace]

# What every package in this repository shares: one version, one edition, one licence, one home.
# A package names them with `.workspace = true` rather than repeating them, so a bump is one edit.
# The version is 0.0.0 in the repository and is never bumped here: a build is named by the day
# it was made, written in by the release workflow before it compiles. See spec/release.md.
[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/canmi21/rdm"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "warn"

[package]
name = "rdm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A download manager for macOS."

# The executable is named what the Dock and the window say, so a build run from the tree is
# the same process name as an installed one. Cargo names a binary once for every system;
# packaging renames it back to rdm on Linux and to the name in full on Windows. Must equal
# identity::DISPLAY_NAME, which a test holds. See spec/packaging.md.
[[bin]]
name = "Downloads"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
env_logger = "0.11"
fancy-regex = "0.19"
futures = "0.3"
gpui = { package = "gpui-unofficial", version = "1" }
# Without font-kit the macOS backend renders no text at all. See spec/framework.md.
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1", features = ["font-kit"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
# The downloads between launches. Bundled, so the build needs no system SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
# The download folder under watch, FSEvents on macOS; see src/watch.rs.
notify = "8"
# A system notification when a newer build is published and the window is not in front; D-Bus
# on Linux through zbus, so no library is needed there. See spec/release.md.
notify-rust = "4"

# See spec/engine.md.
bytes = "1"
infer = "0.22"
md-5 = "0.11"
percent-encoding = "2"
reqwest = { version = "0.13", features = ["stream", "http2", "socks", "system-proxy"] }
# Resolving names without the system's stack: the servers the user names, over 53 or over HTTPS.
# The version follows reqwest's own, which carries the same crate for its `hickory-dns` feature;
# two versions of it would be two resolvers with two caches. See src/dns.rs.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "https-ring", "webpki-roots", "system-config"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time", "macros", "io-util"] }
tokio-util = "0.7"
url = "2"

# What language the machine is set to, for a first launch that has to guess. One small crate
# against three platform APIs. See src/i18n.rs.
sys-locale = "0.3"
# Decodes the tray's PNG, rendered from the artwork by `mise run icon`.
png = "0.18"
# The system's own icon for a file, which arrives as TIFF and is drawn as a gpui RenderImage.
# The version is gpui's own: a RenderImage is built from this crate's Frame, so the two have to
# agree on what a Frame is. See src/thumbnail.rs.
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg", "gif", "webp", "bmp"] }
# What an archive holds, read without unpacking it: zip, 7z, tar and gzip. See src/index.rs.
# zip is also what the Windows build comes in, and tar with flate2 the Linux one; see
# src/update/install.rs.
sevenz-rust2 = { version = "0.22", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# Installing an update: the Windows executable comes in a zip and a running one can only be
# renamed, which self-replace knows; the Linux binary comes in a tarball. See spec/release.md.
[target.'cfg(windows)'.dependencies]
self-replace = "1"

# What asks macOS for the system's icon for a file. objc2-app-kit's version follows gpui's, which
# is what draws the result; two versions of one binding in a process is two NSImage types. See
# src/thumbnail.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData"] }

# The tray on macOS and Windows, where the menu is the system's own. Without libxdo, which only
# the predefined edit items need. Not on Linux: it reaches gtk3 there through muda, which is not
# an optional dependency of it, and gtk3 pins glib to an advisory with no patched release in
# reach. See src/tray.rs and spec/framework.md.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

# The tray on Linux is StatusNotifierItem on the session bus, spoken directly. ksni brings zbus
# and nothing of gtk; "blocking" is the face that runs the service on a thread of its own, which
# suits a gpui loop that is not tokio's. See src/tray.rs.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

# Windows carries the icon inside the executable; build.rs embeds it there. See spec/release.md.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Formatting is rustfmt's and the linter must not report it; see rustfmt.toml.
[lints]
workspace = true

[profile.dev]
opt-level = 2
codegen-units = 256
incremental = true

[profile.dev.package."*"]
opt-level = 3
codegen-units = 16

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The headless tests draw into gpui's test platform; see spec/workflow.md. Paused time lets the
# engine's limiter tests measure seconds of waiting in no time at all.
[dev-dependencies]
gpui = { version = "1", package = "gpui-unofficial", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
