# Cargo walks up the filesystem and would otherwise treat this crate as a member of the
# workspace this directory sits in; declaring one here stops that walk. The engine is a crate of
# its own because it is a library with no window in it: it has its own tests, its own
# dependencies, and nothing in it is dead while the window has not yet been wired to it.
[workspace]
members = ["crates/engine"]

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
complexity = "warn"

[package]
name = "rdm"
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/canmi21/rdm"
description = "A download manager for macOS."

[[bin]]
name = "rdm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
env_logger = "0.11"
fancy-regex = "0.19"
futures = "0.3"
gpui = { package = "gpui-unofficial", version = "1" }
# Without font-kit the macOS backend renders no text at all. See spec/framework.md.
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1", features = ["font-kit"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
rdm-engine = { path = "crates/engine" }

# Formatting is rustfmt's and the linter must not report it; see rustfmt.toml.
[lints]
workspace = true

[profile.dev]
opt-level = 2
codegen-units = 256
incremental = true

[profile.dev.package."*"]
opt-level = 3
codegen-units = 16

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The headless tests draw into gpui's test platform; see spec/workflow.md.
[dev-dependencies]
gpui = { version = "1", package = "gpui-unofficial", features = ["test-support"] }
