# Anything that builds the binary depends on icons, so a fresh clone needs no step before it runs;
# the fetch skips every file already on disk, so it costs nothing after the first time.
[tasks.check]
description = "Type-check the crate and its targets"
depends = ["icons"]
run = "cargo check --all-targets"

[tasks.lint]
description = "Lint the crate, warnings denied"
depends = ["icons"]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run the test suite"
depends = ["icons"]
run = "cargo test"

[tasks.verify]
description = "Everything a change has to pass"
depends = ["check", "lint", "test"]

# The rebuild loop needs a file watcher. Pinned to a major like everything in the workspace list
# one directory up.
[tools]
watchexec = "2"

# Kill, rebuild, reopen on every source change. --project-origin stops watchexec walking up to
# the workspace's .gitignore, which ignores repos/*/ and would make every file here read as
# ignored; see still's mise.toml for the longer account of that one.
#
# The watch roots are src recursively and this directory non-recursively -- Cargo.toml, mise.toml
# and build.rs, and nothing below them. Naming them is not tidiness: .gitignore keeps target/ out
# of the filter but not out of the watch, and target/ here is 46 GB across 118k files, every write
# in it arriving as an event to be filtered one at a time. A loop left running overnight over that
# tree spent 174 minutes of CPU on it and, worse, made the watcher drop events; watchexec reads
# the rescan that follows as a change, so the window was closing and reopening on nothing. The
# extension filter narrows what the roots still let through to source.
[tasks.dev]
description = "Open the window, rebuilding and reopening it as the source changes"
depends = ["icons"]
run = "watchexec --restart --project-origin . --watch src --watch-non-recursive . --exts rs,toml -- cargo run"

# The release build wrapped as the .app, with the icon rendered first. Not part of verify: it is a
# packaging step, run when there is something to look at or hand over.
[tasks.bundle]
description = "Build the release binary and wrap it as the .app under target/bundle"
depends = ["icons", "icon"]
run = ["cargo build --release", ".mise/tasks/bundle"]
