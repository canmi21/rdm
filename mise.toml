# Anything that builds the binary depends on icons, so a fresh clone needs no step before it runs;
# the fetch skips every file already on disk, so it costs nothing after the first time.
[tasks.check]
description = "Type-check the crate and its targets"
depends = ["icons"]
run = "cargo check --all-targets"

[tasks.lint]
description = "Lint the crate, warnings denied"
depends = ["icons"]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run the test suite"
depends = ["icons"]
run = "cargo test"

[tasks.verify]
description = "Everything a change has to pass"
depends = ["check", "lint", "test"]

# The rebuild loop needs a file watcher. Pinned to a major like everything in the workspace list
# one directory up.
[tools]
watchexec = "2"

# Kill, rebuild, reopen on every source change. --project-origin stops watchexec walking up to
# the workspace's .gitignore, which ignores repos/*/ and would make every file here read as
# ignored; see still's mise.toml for the longer account of that one.
#
# The watch roots are src recursively and this directory non-recursively -- Cargo.toml, mise.toml
# and build.rs, and nothing below them. Naming them is not tidiness: .gitignore keeps target/ out
# of the filter but not out of the watch, and target/ here is 16 GB across 37k files the moment a
# clean build finishes and grows from there -- it had reached 84 GB across 137k before a
# `cargo clean -p rdm` took it back -- every write in it arriving as an event to be filtered one
# at a time. A loop left running overnight over that
# tree spent 174 minutes of CPU on it and, worse, made the watcher drop events; watchexec reads
# the rescan that follows as a change, so the window was closing and reopening on nothing. The
# extension filter narrows what the roots still let through to source.
[tasks.dev]
description = "Open the window, rebuilding and reopening it as the source changes"
depends = ["icons"]
run = "watchexec --restart --project-origin . --watch src --watch-non-recursive . --exts rs,toml -- cargo run"

# The release build wrapped as the .app, with the icon rendered first. Not part of verify: it is a
# packaging step, run when there is something to look at or hand over.
[tasks.bundle]
description = "Build the release binary and wrap it as the .app under target/bundle"
depends = ["icons", "icon"]
run = ["cargo build --release", ".mise/tasks/bundle"]

# The verbs the workspace one directory up dispatches to: `mise run update|clean|fmt [name]`.
# Each takes --dry-run and keeps the promises the workspace's spec/architecture/repos.md lists
# under "What a repository's task owes the verb"; the revert after a failed verify is the
# workspace's, so `update` neither verifies nor reverts.
[tasks.update]
description = "Move its own tools, the Zed tag and the crates within their bounds, and name what waits beyond: `update [--dry-run] [--major]`"
usage = '''
flag "-n --dry-run" help="Say what would move and write nothing"
flag "--major" help="Cross the ranges Cargo.toml declares"
'''
run = '''
n=${usage_dry_run:+--dry-run}
# Its own [tools] first, then the Zed tag no resolver moves, then cargo; see spec/framework.md.
# mise follows an upgrade with advice to `upgrade --bump` past the pins, naming the workspace's
# too; following it can take a prerelease, so it is dropped -- the workspace's spec/toolchain.md,
# "Stable means the publisher's channel".
out=$(mise upgrade --local $n 2>&1) || { echo "$out"; exit 1; }
echo "$out" | grep -v -e 'do not match the configured version ranges' -e ' → .* (.*)$' -e 'upgrade --bump' || true
.mise/tasks/zed $n
if [ -n "${usage_major:-}" ]; then cargo upgrade --incompatible $n; fi
cargo update $n
[ -z "${usage_major:-}" ] || exit 0
echo
echo "Beyond the ranges Cargo.toml declares:"
if ! cargo upgrade --version >/dev/null 2>&1; then
	echo "  cargo upgrade is missing, so no crate's major was checked; cargo-edit supplies it"
	exit 0
fi
beyond=$(cargo upgrade --incompatible --dry-run 2>/dev/null)
echo "${beyond:-  nothing; every dependency is at the top of its range}"
'''

[tasks.clean]
description = "Remove what cargo built: `clean [--dry-run]`"
usage = 'flag "-n --dry-run" help="Say what would go and remove nothing"'
run = "cargo clean ${usage_dry_run:+--dry-run}"

# The file set is jj.toml's, so `fmt` and the formatting a commit gets agree.
[tasks.fmt]
description = "Format the Rust and the prose beside it, with jj.toml's formatters: `fmt [--dry-run]`"
usage = 'flag "-n --dry-run" help="List the files that would change and write nothing"'
run = '''
files='**/*.{ts,tsx,mts,cts,js,mjs,cjs,jsx,css,json,jsonc,md,svelte}'
if [ -n "${usage_dry_run:-}" ]; then
	cargo fmt --all --check --message-format short || true
	oxfmt --list-different --no-error-on-unmatched-pattern "$files" || true
else
	cargo fmt --all
	oxfmt --no-error-on-unmatched-pattern "$files"
fi
'''
